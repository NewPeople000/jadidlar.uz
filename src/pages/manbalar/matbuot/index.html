<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn-icons-png.flaticon.com/512/1183/1183807.png"
    />
    <title>Manbalar / Matbuot</title>
    <link rel="stylesheet" href="matbuot.css" />

    <link rel="stylesheet" href="/src/pages/jadidlar/jadidlar.css">
    <!-- Agar maxsus stillar kerak bo'lsa -->
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <!-- Asosiy kontent -->
    <main style="max-width: 1750px; margin: 40px auto; padding: 0 20px">
      <!-- Breadcrumb va Qidiruv -->
      <div style="margin-bottom: 25px">
        <p
          style="
            color: #8a99ad;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
          "
        >
          Bosh sahifa / Matbuot /
          <span class="breadcrumb-highlight" style="color: #2b4c7e">Tarix</span>
        </p>

        <!-- Qidiruv paneli -->
        <div class="search-container">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Matbuot maqolalari bo'yicha qidirish..."
          />
          <button class="search-icon-btn" title="Qidirish">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Kategoriyalar (Tablar) -->
      <div
        class="matbuot-tabs"
        style="
          display: flex;
          gap: 30px;
          border-bottom: 2px solid #e0e6ed;
          margin-bottom: 35px;
          overflow-x: auto;
          padding-bottom: 10px;
          white-space: nowrap;
        "
      >
        <a href="#" class="matbuot-tab active" data-category="tarix">Tarix</a>
        <a href="#" class="matbuot-tab" data-category="siyosat">Siyosat</a>
        <a href="#" class="matbuot-tab" data-category="iqtisod">Iqtisod</a>
        <a href="#" class="matbuot-tab" data-category="madaniyat"
          >Madaniyat va san'at</a
        >
        <a href="#" class="matbuot-tab" data-category="ijtimoiy"
          >Ijtimoiy masalalar va din</a
        >
        <a href="#" class="matbuot-tab" data-category="adabiyot">Adabiyot</a>
        <a href="#" class="matbuot-tab" data-category="talim">Ta'lim-Tarbiya</a>
        <a href="#" class="matbuot-tab" data-category="boshqa"
          >Boshqa masalalar</a
        >
        <a href="#" class="matbuot-tab" data-category="bibliografik"
          >Bibliografik ko'rsatkich</a
        >
      </div>

      <!-- Cardlar Grid joyi -->
      <div id="matbuotGrid" class="books-grid">
        <!-- JavaScript orqali cardlar tushadi -->
      </div>

      <!-- Pagination -->
      <div
        class="pagination-container"
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 8px;
          margin-top: 50px;
          margin-bottom: 40px;
        "
      >
        <button class="page-btn">&lt;&lt;</button>
        <button class="page-number active">1</button>
        <button class="page-number">2</button>
        <button class="page-number">3</button>
        <button class="page-btn">...</button>
        <button class="page-number">8</button>
        <button class="page-btn">&gt;&gt;</button>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/src/components/layout.js"></script>
    <script src="matbuot.js"></script>
  </body>
</html>
